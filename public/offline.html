<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171512" />
    <title>Sin conexión · daily-blocks</title>
    <!-- Static page served by the service worker with no network, so it
         cannot use Tailwind or external fonts: theme values are inlined. -->
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #171512;
        color: #ece7e0;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
        padding: 2rem 1.5rem;
        border: 1px solid #34302a;
        border-radius: 0.75rem;
        background: #1c1a16;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 500;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
        opacity: 0.75;
      }
      button {
        padding: 0.6rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #e08654;
        color: #1a1410;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #ece7e0;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>No hay conexión a internet. Revisa la red y vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
